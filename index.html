<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A romantic Valentine memory slideshow for Shiann Nichole Marcos from Kenjie Lucy."
    />
    <title>LIEB ng Daigdig</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="background-glow" aria-hidden="true"></div>
    <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

    <section class="landing-screen" id="landingScreen" aria-label="Intro screen">
      <div class="landing-card">
        <div class="flower-intro" aria-hidden="true">
          <div class="flower">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
            <span class="flower-core"></span>
            <span class="stem"></span>
            <span class="leaf leaf-left"></span>
            <span class="leaf leaf-right"></span>
          </div>
        </div>

        <div class="landing-content">
          <h1 class="landing-title">
            <span>Mga picture ko at mo</span>
          </h1>
          <p class="landing-subtitle">
            A little gallery of love, laughter, and our favorite moments together.
          </p>
          <button id="startButton" class="btn btn-primary" type="button">
            start mo na malupit yan
          </button>
        </div>
      </div>
    </section>

    <main class="app hidden" id="app">
      <header class="site-header">
        <h2 class="site-title">LIEB ng Daigdig</h2>
      </header>

      <section class="slideshow-shell">
        <article class="slide-card" id="slideCard" aria-live="polite">
          <div class="slide-image-wrap" id="slideImageWrap">
            <img id="slideImage" alt="Memory photo" />
            <div class="image-overlay" aria-hidden="true"></div>
          </div>

          <div class="slide-content">
            <p class="slide-caption" id="slideCaption"></p>
          </div>
        </article>

        <nav class="controls" aria-label="Slideshow controls">
          <button id="prevButton" class="btn btn-control" type="button" aria-label="Previous slide">
            ◀
          </button>
          <button id="autoPlayButton" class="btn btn-control" type="button" aria-label="Toggle auto play">
            Auto: On
          </button>
          <button id="nextButton" class="btn btn-control" type="button" aria-label="Next slide">
            ▶
          </button>
        </nav>

        <div class="dots" id="dotsContainer" aria-label="Slide pagination"></div>
      </section>

      <section class="music-panel" aria-label="Background music controls">
        <div class="music-title">Romantic Music</div>
        <div class="music-controls">
          <button id="musicToggleButton" class="btn btn-secondary" type="button">Pause Music</button>
          <label for="volumeControl">Volume</label>
          <input
            id="volumeControl"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.55"
            aria-label="Music volume control"
          />
        </div>
        <p id="musicStatus" class="music-status" aria-live="polite"></p>
      </section>

      <footer class="site-footer">
        <p>Made with love by Kenjie Lucy</p>
        <p>Gawa ng malupit</p>
      </footer>
    </main>

    <audio id="bgMusic" src="music/romantic.mp3" loop preload="none"></audio>
    <script src="script.js"></script>
  </body>
</html>
